name: frontend-deploy

# Deploys the Astro frontend as a Cloudflare Worker.
#   dev  branch → bx-hive-frontend-dev
#   main branch → bx-hive-frontend
#
#
# The network config (VITE_*) is inlined into the browser bundle at BUILD time,
# and .env.* files are gitignored, so the values come from GitHub Environment
# secrets/variables here. RESEND_API_KEY / TURNSTILE_SECRET_KEY are NOT set here
# — they're Worker runtime secrets, set once per worker in the CF dashboard.

on:
  push:
    branches: [main, dev]
    paths:
      - 'projects/bx-hive-frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: projects/bx-hive-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Scope secrets/vars per target: create "dev" and "production" GitHub Environments.
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-frontend

      - name: Build
        env:
          # Network config — inlined into the client bundle at build time.
          VITE_ENVIRONMENT: ${{ vars.VITE_ENVIRONMENT }}
          VITE_ALGOD_TOKEN: ${{ secrets.VITE_ALGOD_TOKEN }}
          VITE_ALGOD_SERVER: ${{ vars.VITE_ALGOD_SERVER }}
          VITE_ALGOD_PORT: ${{ vars.VITE_ALGOD_PORT }}
          VITE_ALGOD_NETWORK: ${{ vars.VITE_ALGOD_NETWORK }}
          VITE_INDEXER_TOKEN: ${{ secrets.VITE_INDEXER_TOKEN }}
          VITE_INDEXER_SERVER: ${{ vars.VITE_INDEXER_SERVER }}
          VITE_INDEXER_PORT: ${{ vars.VITE_INDEXER_PORT }}
          VITE_REGISTRY_APP_ID: ${{ vars.VITE_REGISTRY_APP_ID }}
          VITE_TRUST_EXPERIMENTS_APP_ID: ${{ vars.VITE_TRUST_EXPERIMENTS_APP_ID }}
          VITE_USDC_ASSET_ID: ${{ vars.VITE_USDC_ASSET_ID }}
          # Turnstile widget key — public, but still build-time inlined.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: pnpm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The adapter flattens [env.*] out of the generated config, so target the
        # dev worker by explicit --name rather than `-e dev`.
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            npx wrangler deploy --config dist/server/wrangler.json
          else
            npx wrangler deploy --config dist/server/wrangler.json --name bx-hive-frontend-dev
          fi
